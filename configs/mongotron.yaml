# MongoTron Configuration for a Nile Testnet Full Archive Node

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  mongodb:
    uri: mongodb://localhost:27017/mongotron
    database: mongotron
    collections:
      addresses: addresses
      transactions: transactions
      events: events
      webhooks: webhooks

blockchain:
  tron:
    node:
      host: localhost
      port: 50051
      use_tls: false
    connection:
      timeout: 30s
      max_retries: 3
      backoff_interval: 5s
      keep_alive: 60s

# Block monitoring of watched addresses
monitor:
  # One shared scanner fetches and parses each block once for every watched address.
  # false = one polling loop per watched address (one block fetch per block per address).
  sharedScanner: true
  # How often the head is polled
  pollInterval: 3s
  # At startup, watched addresses at most this many blocks behind the newest one are
  # caught up together by the scanner; an address further behind catches up on its own.
  catchUpWindow: 1200

worker_pool:
  workers: 1000
  queue_size: 100000
  job_timeout: 60s
  graceful_shutdown_timeout: 30s

logging:
  level: info
  format: json
  output: stdout

metrics:
  prometheus:
    enabled: true
    port: 9090
    path: /metrics

webhooks:
  delivery:
    timeout: 30s
    max_concurrent: 100
    retry_attempts: 3
  # Signs per-subscription webhook posts to non-Porto consumers (same headers as the Porto client)
  subscriptionSecret: "${MONGOTRON_SUBSCRIPTION_WEBHOOK_SECRET}"
  # Porto API Integration for USDT/TRC20 transfer monitoring
  porto:
    enabled: true
    # Porto API base URL, e.g. PORTO_API_URL=http://porto.example.com:8000 (use an IP or a name
    # this host can resolve). Unset = transfer events are not delivered (logged at startup).
    baseUrl: "${PORTO_API_URL}"
    webhookPath: "/v1/webhooks/mongotron/transfer"
    # HMAC-SHA256 secret shared with PortoAPI (MONGOTRON_WEBHOOK_SECRET there). Never commit it:
    # set it in the service environment. Unset = unsigned posts, which PortoAPI rejects.
    webhookSecret: "${MONGOTRON_WEBHOOK_SECRET}"
    # Operation (gas station) events endpoint
    operationPath: "/v1/webhooks/mongotron/operation"
    # energy_usage events: one per transaction (successful or failed) sent BY a watched
    # address of the listed wallet types, with the receipt's energy and bandwidth figures.
    # "*" = every wallet type. keep_level addresses get only these events (no transfer or
    # operation events).
    usageEnabled: true
    usagePath: "/v1/webhooks/mongotron/usage"
    usageWalletTypes: ["keep_level"]
    network: "tron-nile"

api:
  version: v1
  base_path: /api/v1
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst: 50

security:
  api_key_header: X-API-Key
  enable_api_keys: false
  jwt:
    enabled: false
    secret: change-me-in-production
    expiration: 24h
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
